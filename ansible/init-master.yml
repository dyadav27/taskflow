---
# ============================================================
# TaskFlow - Kubernetes Master Initialization (FINAL FIXED)
# ============================================================

- name: Initialize Kubernetes Master Node
  hosts: master
  become: yes

  tasks:

    - name: Initialize Kubernetes cluster with kubeadm
      shell: >
        kubeadm init
        --pod-network-cidr=10.244.0.0/16
        --ignore-preflight-errors=NumCPU,Mem
      register: kubeadm_output
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Show kubeadm init output
      debug:
        var: kubeadm_output.stdout_lines

    - name: Create .kube directory for ubuntu user
      file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copy admin.conf to ubuntu kube config
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ubuntu/.kube/config
        remote_src: yes
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    - name: Install Flannel CNI plugin
      shell: |
        kubectl apply -f https://raw.githubusercontent.com/flannel-io/flannel/master/Documentation/kube-flannel.yml
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config

    - name: Wait for API server to stabilize
      pause:
        seconds: 15

    - name: Generate kubeadm join command
      shell: kubeadm token create --print-join-command
      register: join_command

    - name: Save join command on controller machine
      copy:
        content: "{{ join_command.stdout }}"
        dest: /tmp/kubeadm_join_command.sh
        mode: '0600'
      delegate_to: localhost
      become: no

    - name: Verify join command saved locally
      delegate_to: localhost
      shell: cat /tmp/kubeadm_join_command.sh
      register: verify_join

    - name: Print join command
      debug:
        msg: "{{ verify_join.stdout }}"